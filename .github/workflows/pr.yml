name: PR

on:
  pull_request:
    branches: [develop, main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Which checks does this PR need? Mirrors the `case` glob idiom in
  # .githooks/pre-commit, which keeps the workflow free of a third-party action.
  changes:
    runs-on: ubuntu-latest
    outputs:
      adr: ${{ steps.filter.outputs.adr }}
      manifests: ${{ steps.filter.outputs.manifests }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          adr=false
          manifests=false
          python=false

          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Unquoted on purpose, to split the list into one path per iteration —
          # which also means a path containing whitespace would split into two and
          # match nothing. No such path exists here, and .githooks/pre-commit has
          # the same characteristic; if one is ever added, both need a null-
          # delimited read (git diff -z) rather than word splitting.
          for path in $changed; do
              case "$path" in
                  skills/creative-commits/*)
                      python=true ;;
              esac
              case "$path" in
                  docs/adr/*|scripts/*)
                      adr=true ;;
              esac
              case "$path" in
                  CHANGELOG.md|.claude-plugin/*|scripts/*|\
                  skills/*|.agents/skills/*)
                      manifests=true ;;
              esac
              # A change to the workflow itself re-runs everything it gates.
              case "$path" in
                  .github/workflows/*)
                      adr=true; manifests=true; python=true ;;
              esac
          done

          echo "adr=$adr" >> "$GITHUB_OUTPUT"
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Selected checks: adr=$adr manifests=$manifests python=$python"

  # The pre-commit hook regenerates INDEX.md, but hooks are not installed on
  # clone — this is the backstop for a contributor who never set core.hooksPath.
  adr:
    needs: changes
    if: needs.changes.outputs.adr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate the ADR index
        run: python3 -m scripts.adr.generate_index

      - name: Check the ADR index is up to date
        run: |
          if ! git diff --exit-code docs/adr/INDEX.md; then
              echo "::error::docs/adr/INDEX.md is stale. Run: git config core.hooksPath .githooks"
              exit 1
          fi

  manifests:
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the manifests and skill frontmatter
        run: python3 -m scripts.ci.validate_manifests

      - name: Unit-test the repo scripts
        run: python3 -m unittest discover -s scripts -t . -p 'test_*.py'

      # Against the real CHANGELOG, not fixtures: this is what makes an
      # unreleasable version or a CHANGELOG/plugin.json mismatch fail on the pull
      # request. Without it the release workflow is the first to notice, after the
      # merge to main, where the fix needs a second PR to main. No --out, so the
      # extracted notes land in the log — worth having on the rare run where what
      # the script read is the question.
      - name: Check the release notes resolve
        run: python3 -m scripts.ci.release_notes

  # Mirrors the tooling skills/creative-commits/pyproject.toml already declares.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/creative-commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12 is the requires-python floor, so CI catches syntax newer than the
      # version the package claims to support.
      # Pinned to a commit digest; the v8 line publishes no floating major tag,
      # so the version comment tracks the exact release. Renovate's github-actions
      # manager keeps both digest and comment current.
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          cache-dependency-glob: skills/creative-commits/uv.lock
          enable-cache: true
          python-version: "3.12"

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run black --check .

      - name: Test
        run: uv run pytest

  # The single required status check. Path-filtered jobs report as "skipped"
  # rather than "success", which would deadlock branch protection if each were
  # required directly; depending on them here collapses that into one result.
  gate:
    needs: [adr, changes, manifests, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
