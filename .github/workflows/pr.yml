name: PR

on:
  pull_request:
    branches: [develop, main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Which checks does this PR need? Mirrors the `case` glob idiom in
  # .githooks/pre-commit, which keeps the workflow free of a third-party action.
  changes:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.filter.outputs.manifests }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          manifests=false
          python=false

          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Unquoted on purpose, to split the list into one path per iteration —
          # which also means a path containing whitespace would split into two and
          # match nothing. No such path exists here, and .githooks/pre-commit has
          # the same characteristic; if one is ever added, both need a null-
          # delimited read (git diff -z) rather than word splitting.
          for path in $changed; do
              # Every prefix is spelled out rather than collapsed to skills/*: only
              # the skills shipping a pyproject.toml have a job to run, and a wider
              # glob would run the matrix for every skill edit. The root workspace
              # files and scripts/pyproject.toml gate the same job (ADR 028): a
              # change to either affects what every leg resolves and installs.
              case "$path" in
                  pyproject.toml|uv.lock|scripts/pyproject.toml|\
                  skills/creative-commits/*|skills/nz-english/*|skills/writing-adrs/*)
                      python=true ;;
              esac
              case "$path" in
                  CHANGELOG.md|.claude-plugin/*|scripts/*|\
                  skills/*|.agents/skills/*)
                      manifests=true ;;
              esac
              # A change to the workflow itself re-runs everything it gates. The `adr`
              # job runs unconditionally (ADR 021), so it needs no arm here.
              case "$path" in
                  .github/workflows/*)
                      manifests=true; python=true ;;
              esac
          done

          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Selected checks: manifests=$manifests python=$python"

  # The pre-commit hook runs these checks, but hooks are not installed on clone —
  # this is the backstop for a contributor who never set core.hooksPath. The tool now
  # ships with the writing-adrs skill, so this repository consumes it like any other
  # project would. Runs on every PR, not only ones touching docs/adr/ or skills/: the
  # check revalidates every ADR's scope regardless of what changed, so a path renamed
  # or deleted anywhere else in the repo fails here instead of going stale unnoticed
  # (ADR 021). A stale index is one of its findings, so nothing needs to diff the file.
  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the ADR corpus and index
        run: python3 skills/writing-adrs/adr.py check

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The recipe consumers' CI runs, against this checkout, so it cannot rot unnoticed.
      - name: Check the consumer recipe still resolves
        run: uvx --from ./skills/writing-adrs phx-adr check

  manifests:
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the manifests and skill frontmatter
        run: python3 -m scripts.ci.validate_manifests

      - name: Unit-test the repo scripts
        run: python3 -m unittest discover -s scripts -t . -p 'test_*.py'

      # Against the real CHANGELOG, not fixtures: this is what makes an
      # unreleasable version or a CHANGELOG/plugin.json mismatch fail on the pull
      # request. Without it the release workflow is the first to notice, after the
      # merge to main, where the fix needs a second PR to main. No --out, so the
      # extracted notes land in the log — worth having on the rare run where what
      # the script read is the question.
      - name: Check the release notes resolve
        run: python3 -m scripts.ci.release_notes

  # Mirrors the tooling each skill's pyproject.toml already declares. The matrix values
  # are full paths on purpose: validate_manifests.py looks for each skill directory as a
  # plain substring of this file, so composing them from a bare name would leave
  # `skills/nz-english` absent and fail the manifest check with a message about missing
  # gating. A change to any one skill runs every leg, which is cheap and keeps the filter
  # simple. One uv workspace (ADR 028) now resolves all three against a shared root
  # uv.lock, so sync runs once at the repo root and each leg scopes its own checks with
  # `--directory` rather than a per-leg `uv sync`, which would prune the venv down to
  # that leg's own dependency closure and undo the shared install.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Report every leg, rather than hiding the later failures behind the first.
      fail-fast: false
      matrix:
        skill:
          - skills/creative-commits
          - skills/nz-english
          - skills/writing-adrs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12 is the requires-python floor, so CI catches syntax newer than the
      # version the package claims to support.
      # Pinned to a commit digest; the v8 line publishes no floating major tag,
      # so the version comment tracks the exact release. Renovate's github-actions
      # manager keeps both digest and comment current.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: "3.12"

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --directory ${{ matrix.skill }} ruff check .

      - name: Check formatting
        run: uv run --directory ${{ matrix.skill }} black --check .

      - name: Test
        run: uv run --directory ${{ matrix.skill }} pytest

  # The single required status check. Path-filtered jobs report as "skipped"
  # rather than "success", which would deadlock branch protection if each were
  # required directly; depending on them here collapses that into one result.
  gate:
    needs: [adr, changes, manifests, python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
