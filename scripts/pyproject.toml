# Makes scripts/ a uv workspace member (ADR 031) with no [build-system]: uv resolves
# it as a virtual project, never built or installed. Scripts import only what is declared
# below and run as `uv run python -m scripts.<area>.<name>` (ADR 035), never bare `python3`.

[project]
name = "scripts"
# No build backend below, so nothing reads this — uv requires the field for a
# workspace member, not for it to be meaningful.
version = "0.1.0"
description = "Repository automation: ADR index generation, manifest validation, release notes"
requires-python = ">=3.12, <4"
dependencies = ["pyyaml>=6.0.3,<7"]
