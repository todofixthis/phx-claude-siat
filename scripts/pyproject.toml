# Makes scripts/ a uv workspace member (ADR 031) with no [build-system]: uv resolves
# it as a virtual project, never built or installed, so `python3 -m scripts.<area>.<name>`
# (ADR 011) is unchanged. No dependency is declared yet — every import here stays
# standard library (ADR 007) until a follow-up spends this workspace member on one.

[project]
name = "scripts"
# No build backend below, so nothing reads this — uv requires the field for a
# workspace member, not for it to be meaningful.
version = "0.1.0"
description = "Repository automation: ADR index generation, manifest validation, release notes"
requires-python = ">=3.12, <4"
dependencies = []
