# Workspace root: resolves scripts/ and the three tool-shipping skills against one
# lockfile (ADR 028, discharging ADR 007's root-project trigger). This file carries no
# [project] table of its own — the root is a virtual aggregator, never installed or built.

[tool.uv.workspace]
members = [
    "scripts",
    "skills/creative-commits",
    "skills/nz-english",
    "skills/writing-adrs",
]

# Unified across every member (ADR 028); a member's own pyproject.toml keeps none of
# this, and black/ruff fall back here because .git and this file share the same directory.
[tool.black]
line-length = 96
target-version = ["py312"]

[tool.ruff]
line-length = 96
# ruff's first-party detection otherwise resolves "src" against this file's own
# directory (the repository root), missing each skill's own top-level modules; the
# glob keeps this covering a future skill with no matching edit here (ADR 028).
src = ["scripts", "skills/*"]

# The three members' dev groups were identical ranges kept in three separate files
# (ADR 028's drift finding); one copy here is what a workspace-wide `uv sync` installs
# for every member, so a skill's own pyproject.toml declares none of this either.
[dependency-groups]
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "black>=26,<27",
    "pytest>=9,<10",
    "ruff>=0,<1",
]
