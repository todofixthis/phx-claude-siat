[project]
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
description = "US-to-NZ spelling sweep for the nz-english skill"
license = "MIT"
name = "nz-english"
requires-python = ">=3.12, <4"
version = "1.0.0"

# No runtime dependencies on purpose: the tool is standard library only, so a consumer
# runs `python3 <skilldir>/scan.py` with no virtualenv to build. This project exists for
# the dev toolchain below, which the PR workflow mirrors.

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
]

[tool.black]
line-length = 96

[tool.ruff]
line-length = 96

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "black>=26,<27",
    "pytest>=9,<10",
    "ruff>=0,<1",
]
