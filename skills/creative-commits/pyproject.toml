[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
description = "Emoji seed generator for creative-commits"
dynamic = ["version"]
license = "MIT"
name = "creative-commits"
requires-python = ">=3.12, <4"
dependencies = [
    "emoji>=2,<3",
    "regex>=2026,<2027",
]

[project.scripts]
emoji-seed = "seed:main"

# The plugin version lives only in plugin.json (ADR 001); read it rather than keeping
# a second copy here for the two to drift out of.
[tool.hatch.version]
source = "regex"
path = "../../.claude-plugin/plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["seed.py"]

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Dev toolchain pins and black/ruff settings live once at the workspace root (ADR 031).
