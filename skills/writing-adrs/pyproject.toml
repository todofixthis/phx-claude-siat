[project]
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
description = "ADR scaffolding, index and scope checks for the writing-adrs skill"
license = "MIT"
name = "writing-adrs"
requires-python = ">=3.12, <4"
version = "1.0.0"

# No runtime dependencies on purpose: the tool is standard library only, so a consumer
# runs `python3 <skilldir>/adr.py` with no virtualenv to build. The build backend exists
# so a consumer's CI can run `uvx --from 'git+…#subdirectory=skills/writing-adrs' phx-adr`;
# it packages the modules below and installs nothing into them.

[project.scripts]
phx-adr = "adr:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

[tool.hatch.build.targets.wheel]
only-include = ["adr.py", "frontmatter.py", "hook.py"]

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
]

[tool.black]
line-length = 96
# Pinned so black stops warning that it formatted for a Python it cannot parse.
target-version = ["py312"]

[tool.ruff]
line-length = 96

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "black>=26,<27",
    "pytest>=9,<10",
    "ruff>=0,<1",
]
