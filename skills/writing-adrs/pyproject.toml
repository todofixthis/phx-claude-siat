[project]
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
dependencies = ["pyyaml>=6.0.3,<7"]
description = "ADR scaffolding, index and scope checks for the writing-adrs skill"
dynamic = ["version"]
license = "MIT"
name = "writing-adrs"
requires-python = ">=3.12, <4"

# PyYAML is the one runtime dependency: it decides every frontmatter value (ADR 034), so
# the tool runs from an environment `uv sync` builds, never bare `python3`. The build
# backend exists so a consumer's CI can run
# `uvx --from 'git+…#subdirectory=skills/writing-adrs' phx-adr`; it packages the modules
# below and pulls PyYAML in with them.

[project.scripts]
phx-adr = "adr:cli"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

# The plugin version lives only in plugin.json (ADR 001); read it rather than keeping
# a second copy here for the two to drift out of.
[tool.hatch.version]
source = "regex"
path = "../../.claude-plugin/plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
only-include = ["adr.py", "frontmatter.py", "hook.py"]

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Dev toolchain pins and black/ruff settings (including the py312 target-version, pinned
# so black stops warning that it formatted for a Python it cannot parse) live once at the
# workspace root (ADR 031).
